<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>WebDeck harness - TASK-P3-01-S5</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
        font-size: 13px;
      }
      h1 {
        font-size: 16px;
      }
      h2 {
        font-size: 14px;
        margin-top: 24px;
        border-top: 1px solid #ccc;
        padding-top: 12px;
      }
      button {
        font-size: 13px;
        padding: 6px 12px;
        margin: 0 8px 8px 0;
      }
      input,
      textarea {
        font-family: inherit;
        font-size: 13px;
      }
      input[type='text'] {
        width: 260px;
      }
      textarea {
        width: 100%;
        height: 48px;
      }
      table {
        border-collapse: collapse;
        margin-top: 8px;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 3px 6px;
        text-align: left;
      }
      .row {
        margin-bottom: 8px;
      }
      .warn {
        color: #a00;
        font-weight: bold;
      }
      .frames {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .frames figure {
        margin: 0;
      }
      .frames img {
        max-width: 420px;
        border: 1px solid #999;
      }
      #log {
        white-space: pre-wrap;
        font-family: monospace;
        max-height: 200px;
        overflow: auto;
        background: #f6f6f6;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h1>WebDeck harness · TASK-P3-01-S5</h1>
    <p>버릴 코드다. 제품이 아니다. 리포트는 다운로드 버튼으로만 저장한다.</p>

    <h2>meta</h2>
    <div class="row">
      chromeFullVersion
      <input id="chromeVersion" type="text" placeholder="chrome://version 의 전체 버전" />
      <span id="versionWarn" class="warn"></span>
    </div>
    <div class="row">round <input id="round" type="text" value="roundA" /></div>

    <h2>tabs</h2>
    <button id="listTabs">탭 목록 새로고침</button>
    <div id="tabs"></div>

    <h2>capture</h2>
    <div class="row">
      interval ms <input id="interval" type="text" value="2000" style="width: 80px" />
      <label><input id="pageEnable" type="checkbox" checked /> Page.enable 보내기 (M8)</label>
    </div>
    <button id="start">선택한 탭으로 캡처 시작</button>
    <button id="stop">캡처 정지</button>

    <h2>idle · L1 3조건 (M4)</h2>
    <p>일방 전이다. 누르면 포트를 끊고 이후 통신하지 않는다.</p>
    <button id="idleA">IDLE-A 캡처만 정지</button>
    <button id="idleB">IDLE-B + tabs 리스너 해제</button>
    <button id="idleC">IDLE-C + clearInterval</button>

    <h2>injections · L2 / L3 / B1 / M3</h2>
    <button data-inject="missingTab">존재하지 않는 tabId 로 attach</button>
    <button data-inject="sendAfterDetach">detach 후 sendCommand</button>
    <button data-inject="forceTimeout">타임아웃 강제</button>
    <button data-inject="forceDetach">강제 detach</button>
    <button data-inject="forceDevtools">DEVTOOLS 전이 강제</button>
    <div id="detachReasons"></div>

    <h2>attach 단계 · L8 / L24 / M7</h2>
    <div id="stages"></div>

    <h2>재인코딩 · L7 / M6</h2>
    <button id="reencode">선택한 첫 탭에서 png 1회 캡처 후 q70 / q85</button>
    <div id="reencodeOut" class="frames"></div>

    <h2>probe · L12</h2>
    <button id="probe">OffscreenCanvas / createImageBitmap 프로브</button>

    <h2>사용자 관측</h2>
    <div id="observations"></div>

    <h2>report</h2>
    <button id="download">리포트 내려받기</button>
    <div id="status"></div>
    <div id="log"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
