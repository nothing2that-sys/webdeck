<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>inner-scroll-frame</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Courier New', monospace; background: #0f3d0f; color: #7ee787; }
  .tick {
    height: 200px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    border-bottom: 2px dashed rgba(255, 255, 255, 0.35);
    overflow-wrap: break-word;
  }
  .tick:first-child { font-size: 40px; }
</style>
</head>
<body>
<div class="tick">IFRAME &middot; 0</div>
<div class="tick">IFRAME &middot; 200</div>
<div class="tick">IFRAME &middot; 400</div>
<div class="tick">IFRAME &middot; 600</div>
<div class="tick">IFRAME &middot; 800</div>
<div class="tick">IFRAME &middot; 1000</div>
<div class="tick">IFRAME &middot; 1200</div>
<div class="tick">IFRAME &middot; 1400</div>
<div class="tick">IFRAME &middot; 1600</div>
<div class="tick">IFRAME &middot; 1800</div>
<div class="tick">IFRAME &middot; 2000</div>
<div class="tick">IFRAME &middot; 2200</div>
<div class="tick">IFRAME &middot; 2400</div>
<div class="tick">IFRAME &middot; 2600</div>
<div class="tick">IFRAME &middot; 2800</div>
<div class="tick">IFRAME &middot; 3000</div>
</body>
</html>
